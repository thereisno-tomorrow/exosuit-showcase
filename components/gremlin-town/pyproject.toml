[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "gremlin-town"
version = "0.1.0"
description = "Authenticated request exchange with durable agent handoffs"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.13,<3.14"
dependencies = [
  "brain-core==0.4.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "mcp==1.30.0",
  "pyjwt[crypto]==2.14.0",
  "uvicorn==0.53.0",
  "webauthn==3.0.1",
  "websocket-client==1.9.2",
]

[tool.uv.sources]
brain-core = { path = "../brain-core", editable = true }

[project.scripts]
gremlin-town = "gremlin_town.entrypoint:main"
gremlin-town-brain-connector = "gremlin_town.mcp.local_project_connector:main"

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gremlin_town"]

[tool.hatch.build.targets.wheel.force-include]
"src/gremlin_town/move_over_rules.json" = "gremlin_town/move_over_rules.json"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
