  - gremlin_town_requests_check
  - gremlin_town_operations_get
  - gremlin_town_events_list
  - bc_memory_search
  - bc_memory_list
  - bc_context_retrieve
  - bc_continuity_start
  - bc_continuity_append
  - bc_continuity_recover
  - bc_continuity_list
  - bc_continuity_close
  - bc_decision_record
  - bc_memory_save
  - bc_memory_change
  - bc_memory_read
  - bc_orient
  - bc_next
  - bc_next_respond
  - bc_agenda
