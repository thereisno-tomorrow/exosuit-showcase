author: Nic
kind: standalone
requires_env: []
optional_env:
  - GREMLIN_TOWN_HUB_URL
  - GREMLIN_TOWN_HUB_TOKEN
  - GREMLIN_TOWN_HUB_TOKEN_FILE
provides_tools:
  - gremlin_town_participants_list
