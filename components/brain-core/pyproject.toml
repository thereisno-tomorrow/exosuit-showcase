[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "brain-core"
version = "0.4.0"
description = "Deterministic context assembly and evidence-bearing canonical records."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Proprietary" }
authors = [{ name = "Nic" }]
dependencies = [
  "ruamel.yaml>=0.18.10,<0.19",
  "tzdata>=2025.2",
]

[project.scripts]
brain = "brain_core.cli:main"

[dependency-groups]
dev = [
  "build>=1.2.2,<2",
  "psutil>=6.1,<8",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/brain_core"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["brain_core"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

[tool.uv]
package = true
